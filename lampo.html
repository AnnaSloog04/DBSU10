<html><head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" href="https://oocsi.id.tue.nl/assets/images/OOCSI_logo_no_text.png">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" type="text/css" href="https://oocsi.id.tue.nl/assets/css/pico.indigo.min.css">
  <script type="text/javascript" src="https://oocsi.id.tue.nl/assets/js/p5.min.js"></script>
  <script type="text/javascript" src="https://oocsi.id.tue.nl/assets/js/oocsi-web.js"></script>
  <script type="text/javascript" src="https://oocsi.id.tue.nl/assets/js/things/oocsi-things.min.js"></script>
<style></style></head>
<body>
<script type="text/javascript">

// define your teamspace
  oocsiThingsConfig = {
    teamspace: "team-5"
  };

  // thing variables
  let toggle, dim, volume;

  // Interne logica voor geluid
  let soundOffset = 0;
  let TooLoud = false;
  let circleY = 350;

  // define thing
  function thing() {
    oocsiThings.register('Lampo 🪔', 'lampo', ['toggle', 'dim', 'volume'], ['toggle']);

    toggle = oocsiThings.data('toggle');
    toggle(true);
    
    dim = oocsiThings.data('dim');
    dim(1.0);
    
    volume = oocsiThings.data('volume');
    oocsiThings.connect('toktik', 'tick', 'dim');
    oocsiThings.connect('voluma', 'volume', 'volume');
  }

  function setup() {
    let canvas = createCanvas(windowWidth, windowHeight);
    canvas.parent('canvasContainer');
  }

  function draw() {
    background(0);

    // Read OOCSI-data
    let ON = (typeof toggle === 'function' && toggle() !== undefined) ? toggle() : true;
    let currentDim = (typeof dim === 'function' && dim() !== undefined && dim() !== null) ? dim() : 1.0;
    let currentVol = (typeof volume === 'function' && volume() !== undefined && volume() !== null) ? volume() : 0.0;

    // Limit of dimming the lampo, 0.6 not very sensitive
    let Limit = 0.6; 

    if (currentVol > Limit) {
      if (!TooLoud) {
        soundOffset += 0.02; //dims with this increment
        TooLoud = true;
      }
    } else {
      TooLoud = false;
    }

    // Combine input from Toktik and Voluma
    let endDim = currentDim - soundOffset

    noStroke();
    fill(ON ? map(endDim, -1, 1, 0, 255) : 50);
    circle(width / 2, circleY, height - 100);
    circleY += 0.5;

    // Toktik and Voluma values for debugging
    // fill(255);
    // textSize(14);
    // text("Ontvangen Volume: " + huidigeVol.toFixed(2), 60, height - 30);
    // text("Dim:" + endDim, 300, height - 30);
  }

  function touchEnded() {
    if (typeof toggle === 'function') {
      toggle(!toggle());
      oocsiThings.activity();
    }
  }
</script>
</body></html>
