<style>
:root {
  --g:#a9ff8c; --g2:#e1ffd8; --muted:#5d9560;
  --line:rgba(154,255,133,.24); --bg:#030905;
  --mono:"Courier New",Consolas,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{background:var(--bg);color:var(--g);font-family:var(--mono);text-shadow:0 0 9px rgba(151,255,127,.24)}
body:before{content:"";position:fixed;inset:0;z-index:40;pointer-events:none;background:repeating-linear-gradient(0deg,transparent 0 3px,rgba(0,0,0,.18) 4px);opacity:.48}
body:after{content:"";position:fixed;inset:0;z-index:39;pointer-events:none;background:radial-gradient(ellipse at center,transparent 35%,rgba(0,0,0,.35) 78%,#000 130%)}
#noise{position:fixed;inset:-50%;width:200%;height:200%;z-index:38;pointer-events:none;opacity:.08;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.7'/%3E%3C/svg%3E");animation:noise .2s steps(2) infinite}
@keyframes noise{0%{transform:translate(0)}25%{transform:translate(1%,-1%)}50%{transform:translate(-1%,1%)}75%{transform:translate(1%,1%)}100%{transform:translate(-1%,-1%)}}
.scanbeam{position:fixed;left:0;top:-3px;width:100%;height:2px;z-index:37;pointer-events:none;background:var(--g);opacity:.3;box-shadow:0 0 18px 4px rgba(130,255,100,.12);animation:scan 10s linear infinite}
@keyframes scan{to{top:100%}}
#terminal{position:absolute;inset:0;padding:clamp(20px,4vw,58px);display:flex;flex-direction:column;justify-content:space-between;border:1px solid var(--line);transition:opacity .7s,filter .7s,transform 1s;overflow:hidden}
#terminal:before,#terminal:after{content:"";position:absolute;width:42px;height:42px;border-color:var(--g);border-style:solid;opacity:.65;pointer-events:none}
#terminal:before{top:12px;left:12px;border-width:1px 0 0 1px}
#terminal:after{bottom:12px;right:12px;border-width:0 1px 1px 0}
header,footer{display:flex;justify-content:space-between;align-items:center;gap:20px;position:relative;z-index:2}
.brand{font-size:clamp(15px,2vw,24px);font-weight:bold;letter-spacing:5px;animation:phosphor 5s infinite}
.sub{font-size:10px;letter-spacing:3px;color:var(--muted);margin-top:8px}
.live{font-size:10px;letter-spacing:2px;white-space:nowrap}
.lamp{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--g);box-shadow:0 0 12px var(--g);margin-right:8px;animation:blink 1.5s infinite}
@keyframes blink{50%{opacity:.22}}
@keyframes phosphor{0%,94%,96%,100%{opacity:1}95%{opacity:.6}}
.hud{position:absolute;right:5%;top:29%;width:clamp(90px,13vw,170px);aspect-ratio:1;border:1px solid rgba(169,255,140,.17);border-radius:50%;z-index:1;animation:radarPulse 5s infinite}
.hud:before,.hud:after{content:"";position:absolute;background:rgba(169,255,140,.25)}
.hud:before{height:1px;width:145%;left:-22.5%;top:50%}.hud:after{width:1px;height:145%;top:-22.5%;left:50%}
.hud .ring{position:absolute;inset:20%;border:1px dashed rgba(169,255,140,.28);border-radius:50%;animation:spin 18s linear infinite}
.hud .ring2{position:absolute;inset:38%;border:1px solid rgba(169,255,140,.2);border-radius:50%}
@keyframes spin{to{transform:rotate(360deg)}}@keyframes radarPulse{50%{opacity:.38;transform:scale(.97)}}
.corner-data{position:absolute;right:5%;top:18%;font-size:9px;line-height:2.1;letter-spacing:1.5px;color:rgba(169,255,140,.38);text-align:right}
main{position:relative;z-index:2;width:min(820px,100%);margin:0 auto}
.eyebrow{font-size:10px;letter-spacing:4px;color:var(--muted);margin-bottom:25px}
.eyebrow:before{content:"// ";color:var(--g)}
.caption{font-size:10px;letter-spacing:3px;color:var(--muted);margin-bottom:12px}
.morse{min-height:66px;font-size:clamp(32px,5.2vw,56px);letter-spacing:10px;overflow-wrap:anywhere;transition:color .12s}
.decoded{min-height:80px;font-size:clamp(38px,7vw,78px);letter-spacing:clamp(8px,2vw,21px);overflow-wrap:anywhere}
.rule{height:1px;margin:23px 0;background:linear-gradient(90deg,var(--g),transparent);opacity:.32;animation:rulePulse 4s infinite}
@keyframes rulePulse{50%{opacity:.75}}
.status{display:flex;justify-content:space-between;gap:15px;flex-wrap:wrap;font-size:10px;letter-spacing:2px;color:var(--muted)}
.status strong{font-weight:normal;color:var(--g)}
.activity{position:absolute;bottom:14%;left:clamp(20px,4vw,58px);font-size:9px;letter-spacing:2px;color:var(--muted);z-index:3}
.activity:after{content:" _";animation:blink .7s infinite}
footer{border-top:1px solid var(--line);padding-top:14px;font-size:9px;letter-spacing:2px;color:var(--muted)}
body.glitch #terminal{animation:glitch .22s linear}
@keyframes glitch{25%{transform:translateX(3px);filter:brightness(1.8)}50%{transform:translateX(-3px)}75%{transform:translateX(1px)}}
body.success-flash{animation:flash .2s 4}
@keyframes flash{50%{background:#244d1b}}
/* confirmation scene */
#success{position:fixed;inset:0;z-index:50;background:rgba(2,10,2,.97);display:flex;align-items:center;justify-content:center;text-align:center;padding:20px;opacity:0;visibility:hidden;transition:opacity .6s}
#success.active{visibility:visible;opacity:1}
.success-card{position:relative;width:min(760px,100%);padding:clamp(32px,6vw,70px) 20px;border:1px solid var(--g);background:rgba(4,17,5,.92);box-shadow:0 0 80px rgba(120,255,100,.14),inset 0 0 45px rgba(120,255,100,.06);animation:successReveal .8s ease-out}
.success-card:before,.success-card:after{content:"";position:absolute;height:1px;width:100%;left:0;background:var(--g2);box-shadow:0 0 15px var(--g);animation:sweep 2s ease-in-out infinite alternate}
.success-card:before{top:0}.success-card:after{bottom:0}
@keyframes sweep{from{opacity:.2;transform:scaleX(.2)}to{opacity:1;transform:scaleX(1)}}
@keyframes successReveal{from{opacity:0;transform:scale(.82);filter:blur(5px)}to{opacity:1;transform:scale(1);filter:blur(0)}}
.success-symbol{font-size:54px;animation:blink .7s infinite}
.small{font-size:10px;letter-spacing:4px;color:var(--muted)}
.success-card h1{font-size:clamp(28px,6vw,60px);letter-spacing:clamp(3px,1vw,9px);margin:22px 0}
.success-card p{font-size:clamp(11px,2vw,15px);letter-spacing:3px;line-height:2.2}
/* Blueprint map scene */
#mapScene{position:fixed;inset:0;z-index:60;display:none;overflow:hidden;isolation:isolate;background:#041009;color:var(--g)}
#mapScene.active{display:block;animation:fadeMap 1s ease both}
@keyframes fadeMap{from{opacity:0}to{opacity:1}}
.map-art{position:absolute;inset:-15%;transform:scale(.66) rotate(-3deg);transform-origin:50% 47%;opacity:.92}
#mapScene.active .map-art{animation:mapZoom 9s cubic-bezier(.18,.72,.2,1) forwards}
.map-art svg{display:block;width:100%;height:100%;filter:drop-shadow(0 0 2px rgba(150,255,120,.24))}
@keyframes mapZoom{0%{transform:scale(.66) rotate(-3deg)}34%{transform:scale(1.05) rotate(-1deg)}100%{transform:scale(2.05) rotate(0)}}
.map-wash{position:absolute;inset:0;z-index:1;pointer-events:none;background:radial-gradient(ellipse at 53% 42%,transparent 8%,rgba(2,8,4,.14) 48%,#020704 110%)}
.map-top,.map-bottom{position:absolute;left:5%;right:5%;display:flex;justify-content:space-between;gap:16px;z-index:4;font-size:10px;letter-spacing:2px;color:#91bd7f}
.map-top{top:5%}.map-bottom{bottom:4%;border-top:1px solid rgba(169,255,140,.25);padding-top:12px;color:#5d9560}
.map-title{position:absolute;top:15%;width:100%;text-align:center;z-index:4;font-size:10px;letter-spacing:5px;color:#b8ffa4}
.map-title:before{content:"—  "}
.map-title:after{content:"  —"}
.target{position:absolute;left:70.8%;top:37.5%;width:94px;height:94px;transform:translate(-50%,-50%);border:1px solid var(--g2);border-radius:50%;z-index:5;animation:targetPulse 1.5s infinite}
.target:before,.target:after{content:"";position:absolute;background:var(--g2);box-shadow:0 0 10px var(--g)}
.target:before{height:1px;width:150%;left:-25%;top:50%}
.target:after{width:1px;height:150%;top:-25%;left:50%}
.target .target-inner{position:absolute;inset:22%;border:1px dashed var(--g);border-radius:50%;animation:spin 7s linear infinite}
.target .target-dot{position:absolute;width:6px;height:6px;background:var(--g2);left:calc(50% - 3px);top:calc(50% - 3px);box-shadow:0 0 15px var(--g)}
@keyframes targetPulse{50%{box-shadow:0 0 35px rgba(164,255,131,.35);opacity:.7}}
.coord-panel{position:absolute;left:50%;bottom:10%;width:min(650px,88%);transform:translate(-50%,24px);text-align:center;padding:24px 16px;background:rgba(2,10,4,.9);border-top:1px solid #9ce789;border-bottom:1px solid #9ce789;backdrop-filter:blur(5px);opacity:0;z-index:6;animation:coordArrive 1s 3.2s ease forwards}
@keyframes coordArrive{to{opacity:1;transform:translate(-50%,0)}}
.coord-label{font-size:10px;letter-spacing:4px;color:#91bd7f}
.coord-values{font-size:clamp(22px,4.8vw,43px);line-height:1.45;letter-spacing:2px;margin:14px 0;color:var(--g2);text-shadow:0 0 16px rgba(164,255,131,.65)}
.coord-status{font-size:10px;letter-spacing:3px;line-height:2;color:var(--g)}
.coord-status .lamp{width:6px;height:6px}
.map-label{font-size:13px;fill:#c4ffb3;letter-spacing:2px}
.map-small{font-size:10px;fill:#80b775;letter-spacing:1px}
.map-line{fill:none;stroke:#9aff83;stroke-width:1.2;opacity:.42}
@media(max-width:650px){
  .screen{padding:20px}.corner-data,.hud{opacity:.18}.sub{letter-spacing:1px}.live{font-size:9px}footer{font-size:8px}
  .map-top,.map-bottom{font-size:8px;letter-spacing:1px}.map-title{font-size:9px;letter-spacing:2px}
  .target{left:70.8%;width:65px;height:65px}.coord-panel{bottom:8%}
}
@media(prefers-reduced-motion:reduce){
  *,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important}
}

/* COMBINED VISUAL PASS */
#jungleBackdrop{
  position:fixed;inset:-2%;z-index:0;pointer-events:none;opacity:.63;
  filter:brightness(.8) saturate(.72) drop-shadow(0 0 12px rgba(135,190,89,.1));
}
#terminal{
  z-index:2;
  background:radial-gradient(ellipse at 48% 45%,rgba(8,24,10,.14),rgba(2,8,4,.18) 55%,rgba(0,0,0,.3));
}
#terminal main{background:linear-gradient(90deg,rgba(2,8,4,.22),rgba(2,8,4,.06),transparent);padding:10px 0}
#terminal .hud{filter:drop-shadow(0 0 8px rgba(169,255,140,.12))}
#mapScene{
  background:#030905!important;color:#a9ff8c!important;
  font-family:"Courier New",Consolas,monospace!important;
  text-shadow:0 0 9px rgba(151,255,127,.24);
}
#mapScene.active{display:block;animation:mapNightIn 1s ease both!important}
@keyframes mapNightIn{from{opacity:0;filter:brightness(3) contrast(1.5)}to{opacity:1;filter:brightness(1) contrast(1)}}
#paper{
  position:absolute;inset:-8%;width:116%;height:116%;
  transform:scale(.82) rotate(-1.5deg);
  filter:drop-shadow(0 0 3px rgba(154,255,131,.18));
}
#mapScene.active #paper{animation:nightMapZoom 8s cubic-bezier(.18,.72,.2,1) forwards}
@keyframes nightMapZoom{0%{transform:scale(.82) rotate(-1.5deg)}34%{transform:scale(1.05) rotate(-.7deg)}100%{transform:scale(1.48) rotate(0deg) translate(-1%,-1%)}}
#paper svg{width:100%;height:100%;display:block}
#paper svg rect:first-of-type{fill:#041009}
#paper svg pattern path{stroke:#8bff78!important;opacity:.22!important}
#paper svg g[fill="none"]{stroke:#83c76d}
#paper svg use{stroke:#a9ff8c!important;opacity:.62}
#paper svg path{stroke:#8bff78}
#paper svg path[fill="none"]{stroke:#8bff78}
#paper svg rect[fill="url(#papergrid)"]{fill:#041009}
.map-scanbeam{position:absolute;left:0;top:-15%;width:100%;height:18%;z-index:3;pointer-events:none;background:linear-gradient(180deg,transparent,rgba(169,255,140,.10),transparent);animation:mapSweep 9s linear infinite;opacity:.55}
@keyframes mapSweep{to{top:115%}}
.paper-grain{
  position:absolute;inset:0;pointer-events:none;opacity:.13;mix-blend-mode:screen;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='p'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.72' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23p)' opacity='.4'/%3E%3C/svg%3E");
}
#mapScene:before{
  content:"";position:absolute;inset:0;z-index:2;pointer-events:none;
  background:repeating-linear-gradient(0deg,transparent 0 3px,rgba(0,0,0,.28) 4px);
  opacity:.55;
}
#mapScene:after{
  content:"";position:absolute;inset:0;z-index:2;pointer-events:none;
  background:radial-gradient(ellipse at center,transparent 20%,rgba(0,0,0,.25) 65%,#000 130%);
}
.map-header{
  position:absolute;left:5%;right:5%;top:4%;display:flex;justify-content:space-between;
  align-items:flex-start;gap:20px;z-index:4;font-size:9px;letter-spacing:2px;color:#91bd7f;
  text-shadow:0 0 9px rgba(151,255,127,.35);
}
.map-header strong{display:block;font-size:clamp(15px,2vw,22px);letter-spacing:3px;margin-bottom:7px}
.map-stamp{border:1px solid #a9ff8c;color:#d1ffb6;padding:10px 14px;transform:rotate(5deg);font-weight:bold;letter-spacing:3px;font-size:11px;box-shadow:0 0 16px rgba(169,255,140,.12)}
.map-overlay{
  position:absolute;z-index:4;left:5%;bottom:5%;width:min(390px,90vw);
  background:rgba(2,10,4,.91);border:1px solid rgba(169,255,140,.6);
  padding:19px 22px;box-shadow:0 0 35px rgba(94,255,87,.12),inset 0 0 25px rgba(94,255,87,.04);
  opacity:0;transform:translateY(18px);
}
#mapScene.active .map-overlay{animation:mapCard .8s 2.1s ease-out forwards}
.map-kicker{font-size:8px;letter-spacing:3px;color:#7fbf6b}
.map-place{font-size:clamp(21px,4vw,31px);letter-spacing:2px;color:#d1ffb6;margin:10px 0 13px;font-weight:bold;text-shadow:0 0 15px rgba(169,255,140,.35)}
.map-coords{font-size:13px;line-height:1.8;letter-spacing:1px;color:#a9ff8c}
.map-rule{height:1px;background:#748068;margin:12px 0;opacity:.7}
.map-footer{display:flex;justify-content:space-between;gap:12px;font-size:8px;letter-spacing:1.5px;color:#6eaa61}
.map-cross{
  position:absolute;z-index:3;left:70.8%;top:38%;width:80px;height:80px;transform:translate(-50%,-50%);
  border:1px solid #d1ffb6;border-radius:50%;color:#d1ffb6;opacity:0;
  filter:drop-shadow(0 0 9px rgba(169,255,140,.65));
}
.map-cross:before,.map-cross:after{content:"";position:absolute;background:#d1ffb6;box-shadow:0 0 10px #a9ff8c}
.map-cross:before{height:1px;left:-30%;right:-30%;top:50%}
.map-cross:after{width:1px;top:-30%;bottom:-30%;left:50%}
.map-cross i{position:absolute;inset:20%;border:1px dashed #a9ff8c;border-radius:50%;animation:rotate 14s linear infinite}
.map-cross b{position:absolute;left:calc(50% - 3px);top:calc(50% - 3px);width:6px;height:6px;background:#e1ffd8;box-shadow:0 0 12px #a9ff8c}
#mapScene.active .map-cross{animation:crossIn .7s 1.1s forwards}
@keyframes mapCard{to{opacity:1;transform:translateY(0)}}
@keyframes crossIn{to{opacity:1}}
@keyframes rotate{to{transform:rotate(360deg)}}
@media(max-width:600px){
 #jungleBackdrop{opacity:.48}
 .map-header{top:3%}.map-stamp{font-size:8px;padding:7px}
 .map-cross{width:55px;height:55px}.map-overlay{bottom:4%;padding:14px 16px}
}
</style>
</head>
