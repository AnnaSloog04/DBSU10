<html><head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" href="https://oocsi.id.tue.nl/assets/images/OOCSI_logo_no_text.png">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" type="text/css" href="https://oocsi.id.tue.nl/assets/css/pico.indigo.min.css">
  <script type="text/javascript" src="https://oocsi.id.tue.nl/assets/js/p5.min.js"></script>
  <script type="text/javascript" src="https://oocsi.id.tue.nl/assets/js/oocsi-web.js"></script>
  <script type="text/javascript" src="https://oocsi.id.tue.nl/assets/js/things/oocsi-things.min.js"></script>
<style></style></head>
<body>
<script type="text/javascript">

// define your teamspace
  oocsiThingsConfig = {
    teamspace: "team-5"
  };

  // thing variables
  let toggle, dim, volume;

  // Interne logica voor geluid
  let geluidsOffset = 0;
  let wasTeHard = false;
  let circleY = 500;

  // define thing
  function thing() {
    // 1. Registreer Lampo met 'volume' als input
    oocsiThings.register('Lampo 🪔', 'lampo', ['toggle', 'dim', 'volume'], ['toggle']);

    toggle = oocsiThings.data('toggle');
    toggle(true);
    
    dim = oocsiThings.data('dim');
    dim(1.0);

    // 2. Registreer de eigen variabele 'volume'
    volume = oocsiThings.data('volume');

    // 3. LET OP: 3e argument moet de STRING zijn ('volume' en 'dim')
    oocsiThings.connect('toktik', 'tick', 'dim');
    oocsiThings.connect('voluma', 'volume', 'volume');
  }

  function setup() {
    let canvas = createCanvas(windowWidth, windowHeight);
    canvas.parent('canvasContainer');
  }

  function draw() {
    background(0);

    // Uitlezen van de OOCSI-data
    let isAan = (typeof toggle === 'function' && toggle() !== undefined) ? toggle() : true;
    let huidigeDim = (typeof dim === 'function' && dim() !== undefined && dim() !== null) ? dim() : 1.0;
    let huidigeVol = (typeof volume === 'function' && volume() !== undefined && volume() !== null) ? volume() : 0.0;

    // Geluidslogica: bij hard geluid (boven 0.3) dimmen
    let drempelwaarde = 0.3; // Iets gevoeliger ingesteld op 0.3

    if (huidigeVol > drempelwaarde) {
      if (!wasTeHard) {
        geluidsOffset += 0.02; // Bij elke schreeuw/klap permanent 0.02 donkerder
        wasTeHard = true;
      }
    } else {
      wasTeHard = false;
    }

    // Combineer Toktik-dimstand en Geluidsoffset
    let endDim = huidigeDim - geluidsOffset

    noStroke();
    fill(isAan ? map(endDim, -1, 1, 0, 255) : 50);
    circle(width / 2, circleY, height - 100);
    circleY += 0.01;

    // Visualiseer onderin het scherm de ontvangen volume-waarde voor debugging
    // fill(255);
    // textSize(14);
    // text("Ontvangen Volume: " + huidigeVol.toFixed(2), 60, height - 30);
    // text("Dim:" + endDim, 300, height - 30);
  }

  function touchEnded() {
    if (typeof toggle === 'function') {
      toggle(!toggle());
      oocsiThings.activity();
    }
  }
</script>
</body></html>
