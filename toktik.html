<html><head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" href="https://oocsi.id.tue.nl/assets/images/OOCSI_logo_no_text.png">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" type="text/css" href="https://oocsi.id.tue.nl/assets/css/pico.indigo.min.css">
  <script type="text/javascript" src="https://oocsi.id.tue.nl/assets/js/p5.min.js"></script>
  <script type="text/javascript" src="https://oocsi.id.tue.nl/assets/js/oocsi-web.js"></script>
  <script type="text/javascript" src="https://oocsi.id.tue.nl/assets/js/things/oocsi-things.min.js"></script>
<style></style></head>
<body>
<script type="text/javascript">

// define your teamspace
  oocsiThingsConfig = {
    teamspace: "team-5"
  };

  let toggle, tick;

  function thing() {
    oocsiThings.register('Toktik ⏲️', 'toktik', ['toggle'], ['tick']);
    toggle = oocsiThings.data('toggle');
    toggle(true);
    tick = oocsiThings.data('tick');
  }

  let tickCount = 0;

  function setup() {
    let canvas = createCanvas(windowWidth, windowHeight);
    canvas.parent('canvasContainer');

    // Gebruik setInterval i.p.v. p5.js frameRate, zodat het op de achtergrond doorloopt
    setInterval(runTick, 1000);
  }

  function runTick() {
    if (typeof toggle === 'function' && toggle()) {
      tickCount++;
      if (typeof tick === 'function') {
        tick(1 - tickCount * 0.003); // Stuur de tick-waarde door
      }
      if (typeof oocsiThings !== 'undefined') {
        oocsiThings.activity();
      }
    }
  }

  function draw() {
    background(0);      
    translate(width / 2, height / 2);
    rotate(radians(tickCount));
    stroke(255, 200, 0);
    line(0, 0, 0, -min(height, width) / 3);
  }
</script>
</body></html>
