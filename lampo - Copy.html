<html><head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" href="https://oocsi.id.tue.nl/assets/images/OOCSI_logo_no_text.png">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" type="text/css" href="https://oocsi.id.tue.nl/assets/css/pico.indigo.min.css">
  <script type="text/javascript" src="https://oocsi.id.tue.nl/assets/js/p5.min.js"></script>
  <script type="text/javascript" src="https://oocsi.id.tue.nl/assets/js/oocsi-web.js"></script>
  <script type="text/javascript" src="https://oocsi.id.tue.nl/assets/js/things/oocsi-things.min.js"></script>
<style></style></head>
<body>
<script type="text/javascript">

// define your teamspace
  oocsiThingsConfig = {
    teamspace: "team-5"
  };

  // thing variables
  let toggle, dim, vol;

  // Interne logica voor geluid
  let geluidsOffset = 0;
  let wasTeHard = false;

  // define thing
  function thing() {
    oocsiThings.register('Lampo 🪔', 'lampo', ['toggle', 'dim', 'volume'], ['toggle']);

    toggle = oocsiThings.data('toggle');
    toggle(true);
    
    dim = oocsiThings.data('dim');
    dim(1.0); // Startstand: helder

    vol = oocsiThings.data('volume');

    // Koppelingen
    oocsiThings.connect('toktik', 'tick', 'dim');
    oocsiThings.connect('voluma', 'volume', 'vol');
  }

  function setup() {
    let canvas = createCanvas(windowWidth, windowHeight);
    canvas.parent('canvasContainer');
  }

  function draw() {
    background(0);

    // 1. Veilige uitlezing (gebruik 1.0 als toktik nog niks gestuurd heeft)
    let isAan = (typeof toggle === 'function' && toggle() !== undefined) ? toggle() : true;
    let huidigeDim = (typeof dim === 'function' && dim() !== undefined && dim() !== null) ? dim() : 1.0;
    let huidigeVol = (typeof vol === 'function' && vol() !== undefined && vol() !== null) ? vol() : 0.0;

    // 2. Geluidslogica (permanent stapje extra dimmen bij piek boven drempelwaarde)
    let drempelwaarde = 0.5;
    if (huidigeVol > drempelwaarde) {
      if (!wasTeHard) {
        geluidsOffset += 0.2;
        wasTeHard = true;
      }
    } else {
      wasTeHard = false;
    }

    // 3. Combineer de dimwaarde van Toktik direct met de geluidsoffset
    let eindDim = constrain(huidigeDim - geluidsOffset, -1, 1);

    // 4. Bereken helderheid en teken de lamp
    let helderheid = isAan ? map(eindDim, -1, 1, 0, 255) : 50;

    noStroke();
    fill(helderheid);
    rect(50, 50, width - 100, height - 100);
  }

  function touchEnded() {
    if (typeof toggle === 'function') {
      toggle(!toggle());
      oocsiThings.activity();
    }
  }
</script>
</body></html>
