<html><head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" href="https://oocsi.id.tue.nl/assets/images/OOCSI_logo_no_text.png">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" type="text/css" href="https://oocsi.id.tue.nl/assets/css/pico.indigo.min.css">
  <script type="text/javascript" src="https://oocsi.id.tue.nl/assets/js/p5.min.js"></script>
  <script type="text/javascript" src="https://oocsi.id.tue.nl/assets/js/oocsi-web.js"></script>
  <script type="text/javascript" src="https://oocsi.id.tue.nl/assets/js/things/oocsi-things.min.js"></script>
</head><body>
  <div id="canvasContainer"></div>
<script type="text/javascript">
    // 1. OOCSI Teamspace configuratie
    oocsiThingsConfig = {
      teamspace: "team-5"
    };

    let brightnessVar, color_r_var, color_g_var, color_b_var;

    function thing() {
      oocsiThings.register('Colorado Cam 🤩', 'coloradocam', ['toggle'], ['brightness', 'color_r', 'color_g', 'color_b']);

      brightnessVar = oocsiThings.data('brightness');
      color_r_var = oocsiThings.data('color_r');
      color_g_var = oocsiThings.data('color_g');
      color_b_var = oocsiThings.data('color_b');
    }

    // 2. Puzzel stappen (Volgorde: Groen -> Rood -> Blauw)
    let puzzleSteps = [
      { name: "Groen", targetHue: 130 },
      { name: "Rood",  targetHue: 0 },
      { name: "Blauw", targetHue: 240 }
    ];
    let currentStepIndex = 0;

    // Puzzel instellingen
    let tolerance = 30;     
    let hotZone = 50;       
    let minSaturation = 0.15;
    let minBrightness = 0.10;
    let holdTime = 5000;    // 5 seconden vasthouden om door te gaan

    let holdStart = 0;
    let signalSent = false; 
    let allCompleted = false;
    let capture;

    let hue = 0, saturation = 0, brightnessVal = 0;

    function setup() {
      let canvas = createCanvas(windowWidth, windowHeight);
      canvas.parent('canvasContainer');
      frameRate(10);
      background(0);
      
      let options = {
        audio: false,
        video: { facingMode: { exact: "environment" } }
      };
      capture = createCapture(options);
      capture.size(180, 100);
      capture.hide();
    }

    function calculateHsv(r, g, b) {
      let highest = Math.max(r, Math.max(g, b));
      let lowest = Math.min(r, Math.min(g, b));
      let diff = highest - lowest;

      brightnessVal = highest;
      saturation = (highest > 0) ? (diff / highest) : 0;

      if (diff === 0) {
        hue = 0;
        return;
      }

      if (highest === r) hue = 60 * ((g - b) / diff);
      else if (highest === g) hue = 60 * ((b - r) / diff + 2);
      else hue = 60 * ((r - g) / diff + 4); 

      if (hue < 0) hue += 360;
    }

    function hueDistance(target) {
      let d = Math.abs(hue - target);
      if (d > 180) d = 360 - d;
      return d;
    }

    function draw() {
      background(0);
      
      image(capture, width/2 - 90, height/2 - 70, 180, 100);
      loadPixels();
      let col = get(width/2, height/2);
      
      fill(col);
      ellipse(width/2, height/2 + 130, 60, 60);

      let rNorm = red(col) / 255;
      let gNorm = green(col) / 255;
      let bNorm = blue(col) / 255;
      let brightNorm = brightness(col) / 255;

      if (typeof brightnessVar === 'function') {
        brightnessVar(map(brightNorm, 0, 1, 0, 1));
        color_r_var(rNorm);
        color_g_var(gNorm);
        color_b_var(bNorm);
        oocsiThings.activity();
      }

      calculateHsv(rNorm, gNorm, bNorm);

      let now = millis();
      let currentGoal = puzzleSteps[currentStepIndex];
      let distance = hueDistance(currentGoal.targetHue);

      let puzzleState = "cold";

      // 1. Bepaal de state
      if (!allCompleted) {
        if (saturation < minSaturation || brightnessVal < minBrightness) {
          puzzleState = "cold";
        } else if (distance <= tolerance) {
          puzzleState = "hold";
        } else if (distance <= hotZone) {
          puzzleState = "hot";
        } else {
          puzzleState = "cold";
        }

        // 2. OOCSI Signaal versturen (HIGH als in de buurt, LOW als weggelopen)
        if ((puzzleState === "hot" || puzzleState === "hold") && !signalSent) {
          signalSent = true; 
          OOCSI.newMessage("wristband_B");
          OOCSI.addInt("buttonstate", 1);
          OOCSI.sendMessage();
        } 
        else if (puzzleState === "cold" && signalSent) {
          signalSent = false;
          OOCSI.newMessage("wristband_B");
          OOCSI.addInt("buttonstate", 0);
          OOCSI.sendMessage();
        }

        // 3. Hold timer & volgorde logica
        if (puzzleState === "hold") {
          if (holdStart === 0) holdStart = now; 
          
          if (now - holdStart >= holdTime) {
            currentStepIndex++; // Volgende kleur
            holdStart = 0;      
            signalSent = false; // Reset zodat de volgende kleur weer een signaal stuurt

            if (currentStepIndex >= puzzleSteps.length) {
              allCompleted = true;
              // OOCSI.newMessage(fire);
              // OOCSI.addInt(, );
              // OOCSI.sendMessage();
            }
          }
        } else if (puzzleState === "cold") {
          holdStart = 0; // Timer resetten als ze weglopen
        }
      }

      // 4. Visuele feedback op het scherm
      fill(255);
      textSize(20);
      textAlign(CENTER);

      if (!allCompleted) {
        text("Find colour: " + currentGoal.name, width/2, height/2 + 45);
        text("Status: " + puzzleState, width/2, height/2 + 75);
        
        if (holdStart !== 0) {
          let elapsed = (now - holdStart) / 1000;
          text("Hold: " + elapsed.toFixed(1) + "s / 5.0s", width/2, height/2 + 100);
        }
      } else {
        fill(0, 255, 0);
        textSize(24);
        text("Puzzle solved", width/2, height/2 + 60);
      }
    }
  </script></body></html>
